# fly.toml app configuration file generated for candibet on 2026-10-14T20:41:23-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'candibet'
primary_region = 'gru'

[build]
[env]
  HOST = '0.0.0.0'
  OPERATOR_DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'candibet_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
