# Render deploy — candibet. Gives https://candibet.onrender.com.
#
#   New > Blueprint, point Render at this repo, Apply. Render reads this file
#   and builds the image itself: the Dockerfile builds the storefront from
#   web/, so nothing has to be built or committed from your machine first.
#
# Render injects $PORT itself, so PORT is not set here.
#
# On the free plan: no persistent disk (the ledger, player profiles and rounds
# live in $OPERATOR_DATA_DIR and are lost when the instance is redeployed or
# spun down — Render recycles idle free instances after ~15 min). Uncomment
# `disk` on a paid instance to keep them, and the demo comes back as it was.
services:
  - type: web
    name: candibet
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # the ledger is JSONL under a single lock: one instance, never two
    numInstances: 1
    healthCheckPath: /api/health
    # Render routes to 0.0.0.0:$PORT; without HOST the server would bind
    # 127.0.0.1 and the deploy would answer "connection refused" forever
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPERATOR_DATA_DIR
        value: /data
      # The Vercel storefront proxies /api to this backend, so a browser write
      # arrives with the frontend in Origin and the backend in Host. Naming the
      # frontend here lets the same-origin write guard see through the proxy
      # (demo.server.same_origin). Comma-separated hostnames or origins.
      - key: FRONTEND_ORIGINS
        value: cadiback-web.vercel.app
      # Canonical storefront origin for links that leave the process by email
      # (password reset, decision 0068). Never derive this from a request
      # header: a resettable Host/X-Forwarded-Host would poison the link.
      - key: PUBLIC_SITE_URL
        value: https://cadiback-web.vercel.app
      # Asaas Pix rail (decision 0045, runbook docs/asaas.md). Real Pix when
      # all four are set; the instant demo credit is the fallback when they
      # are not. `sync: false` keeps the secrets out of the repository: enter
      # them in the dashboard, or let scripts/render_deploy.py carry them from
      # the local gitignored .env.asaas. Never put a key in this file.
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_CUSTOMER_ID
        sync: false
      - key: ASAAS_WEBHOOK_SECRET
        sync: false
      - key: ASAAS_BASE_URL
        value: https://sandbox.asaas.com/api/v3
      # NOWPayments crypto rail (decision 0057, docs/crypto.md). Real crypto
      # when the key is set; the crypto tab stays hidden otherwise. `sync: false`
      # keeps the secrets out of the repository — enter them in the dashboard,
      # or let scripts/render_deploy.py carry them from the local gitignored
      # .env.crypto. Never put a key in this file.
      - key: CRYPTO_API_KEY
        sync: false
      - key: CRYPTO_IPN_SECRET
        sync: false
      - key: CRYPTO_BASE_URL
        value: https://api.nowpayments.io/v1
      - key: CRYPTO_PRICE_CURRENCY
        value: brl
      # Resend email (decision 0047, docs/mail.md). Optional: with no key the
      # server logs instead of sending (the console mailer), so a deploy
      # without email stays healthy. `sync: false` keeps the key out of the
      # repository — let scripts/render_deploy.py carry it from the local
      # gitignored .env.resend. Never put a key in this file.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Cloudflare Turnstile bot gate on player login/signup (decision 0048,
      # docs/turnstile.md). Optional: with no secret the verifier is disabled
      # and the gate is a no-op, so a deploy without it stays healthy. The
      # secret is the only sensitive value; the site key is public and the
      # hostnames are an allowlist. `sync: false` keeps the secret out of the
      # repository — let scripts/render_deploy.py carry all three from the
      # local gitignored .env.turnstile. Never put the secret in this file.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
      # Supabase Postgres (decision 0049, docs/supabase.md). Optional: with no
      # DATABASE_URL the server keeps files, so a deploy without it stays
      # healthy. `sync: false` keeps the URL out of the repository — let
      # scripts/render_deploy.py carry it from the local gitignored
      # .env.supabase. Never put the URL in this file.
      - key: DATABASE_URL
        sync: false
      # Better Auth social login — Google/Facebook/Apple + CPF (decision 0066,
      # docs/oauth.md). A small Node sidecar runs beside the Python server and
      # owns the provider credentials; the backend only verifies the signed
      # identity bridge. Optional: with no provider credentials the sidecar
      # reports itself disabled and the social buttons stay hidden. `sync:
      # false` keeps every secret out of the repository — scripts/render_deploy.py
      # carries them from the local gitignored `.env.betterauth`.
      - key: BETTER_AUTH_URL
        value: https://cadiback.onrender.com
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://cadiback.onrender.com,https://cadiback-web.vercel.app
      - key: BETTER_AUTH_APP_NAME
        value: candibet
      - key: BETTER_AUTH_INTERNAL_PORT
        value: "3100"
      - key: BETTER_AUTH_PROVIDERS
        value: google,facebook,apple
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_BRIDGE_SECRET
        sync: false
      - key: BETTER_AUTH_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
    # disk:            # paid plans only
    #   name: candibet-data
    #   mountPath: /data
    #   sizeGB: 1